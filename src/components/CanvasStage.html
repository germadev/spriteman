<script :setup="{
  t,
  canvasService,
  Icon,
  onPaintStroke,
  getPaintLayerPixels,
  onPickColor,
  onSelectionEdit,
  onReplaceAt,
  isAllLayersSelected,
  onStartMoveReference,
  onMoveReference,
  onStartTranslateLayer,
  onTranslateLayer,
  onStartMovePixel,
  onMovePixel,
  onZoomChange
}" type="text/typescript">
  const { getFloodFillPixels, getLinePixels, getShapePixels, getTouchDistance, getTouchMidpoint, parsePixelKey } = await import('../helpers/canvas.helper');

  let curZoom = canvasService.getZoom();
  type PaintTool = 'pencil' | 'fill' | 'picker' | 'line' | 'rectangle' | 'circle' | 'triangle' | 'selection' | 'replace';
  let activeTool: PaintTool = 'pencil';

  // Assigned once the stage is mounted; releases every window listener it registered.
  let dispose: () => void = () => {};

  canvasService.onZoom((z: number) => {
    curZoom = z;
    onZoomChange?.(z);
  });

  await $mounted();

  const root = $self('.canvas-stage-root') || document.querySelector('.canvas-stage-root');
  const canvas = root ? (root.querySelector('canvas') as HTMLCanvasElement) : null;
  const ctx = canvas ? canvas.getContext('2d') : null;

  if (root && canvas && ctx) {
    // Listeners registered on window are torn down together when the stage goes away.
    const teardown = new AbortController();
    const listen = { signal: teardown.signal };

    // Modifier key state
    let isShiftHeld = false;
    let isCtrlHeld = false;
    let isCmdHeld = false;
    let isAltHeld = false;
    let layerTarget = false;
    let moveMode = false;
    const targetsLayer = () => layerTarget || isShiftHeld;
    const movesArtwork = () => moveMode || isCtrlHeld;

    let isMouseDown = false;
    let isMousePanning = false;
    let mousePanStart = { x: 0, y: 0 };

    let isMovingLayer = false;
    let layerDragStartClient = { x: 0, y: 0 };
    let layerDragTotalDisplacement = { x: 0, y: 0 };

    let isSpaceHeld = false;
    let isDraggingLoosePixel = false;
    let draggedPixelStart = { x: 0, y: 0 };
    let draggedPixelCurrent = { x: 0, y: 0 };
    let isDraggingReference = false;
    let draggedReferenceCurrent = { x: 0, y: 0 };
    let referenceDragMoved = false;
    let referenceDragStartedExisting = false;

    let isPainting = false;
    let currentPaintColor = '#000000';
    let lastPaintedPixel: { x: number; y: number } | null = null;
    let currentStrokePixels: Array<{ x: number; y: number }> = [];
    let dragStart: { x: number; y: number } | null = null;
    let dragEnd: { x: number; y: number } | null = null;
    let movingSelection = false;
    let selection: { left: number; top: number; right: number; bottom: number } | null = null;
    let clipboard: Record<string, string> = {};
    let clipboardOrigin = { x: 0, y: 0 };

    // Touch gesture state
    let isTwoFingerGesture = false;
    let initialTouchDistance = 0;
    let initialTouchZoom = 6;
    let lastTouchMidpoint: { x: number; y: number } | null = null;

    // Viewport geometry, cached so pointer handling never forces a layout.
    let viewRect = canvas.getBoundingClientRect();
    let cssWidth = viewRect.width;
    let cssHeight = viewRect.height;
    let appliedCursor = '';

    const refreshViewRect = () => {
      viewRect = canvas.getBoundingClientRect();
    };

    const resizeSurface = (width: number, height: number) => {
      const dpr = window.devicePixelRatio || 1;
      const deviceWidth = Math.max(1, Math.round(width * dpr));
      const deviceHeight = Math.max(1, Math.round(height * dpr));
      cssWidth = width;
      cssHeight = height;
      if (canvas.width !== deviceWidth || canvas.height !== deviceHeight) {
        canvas.width = deviceWidth;
        canvas.height = deviceHeight;
      }
      // One scale for the whole surface: every draw call below works in CSS pixels.
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      refreshViewRect();
    };

    const paint = () => {
      canvasService.redraw(ctx, cssWidth, cssHeight, {
        isShiftHeld: !isAllLayersSelected?.() && movesArtwork() && targetsLayer() && activeTool !== 'selection',
        isCtrlHeld: !isAllLayersSelected?.() && movesArtwork() && !targetsLayer() && activeTool !== 'selection',
        isCmdHeld,
        isAltHeld,
        isDragging: isMovingLayer || isDraggingLoosePixel || isDraggingReference || isMousePanning,
      });
      const origin = canvasService.getArtboardOrigin(cssWidth, cssHeight);
      const zoom = canvasService.getZoom();
      if (dragStart && dragEnd && activeTool !== 'pencil') {
        if (activeTool === 'selection') {
          const left = Math.min(dragStart.x, dragEnd.x);
          const top = Math.min(dragStart.y, dragEnd.y);
          ctx.strokeStyle = '#0284c7';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 3]);
          ctx.strokeRect(origin.x + left * zoom, origin.y + top * zoom,
            (Math.abs(dragEnd.x - dragStart.x) + 1) * zoom,
            (Math.abs(dragEnd.y - dragStart.y) + 1) * zoom);
          ctx.setLineDash([]);
        } else if (['line', 'rectangle', 'circle', 'triangle'].includes(activeTool)) {
          const { width, height } = canvasService.getCanvasSize();
          const filled = !!root.closest('.app-container')?.querySelector<HTMLInputElement>('.shape-filled')?.checked;
          const points = getShapePixels(activeTool as 'line' | 'rectangle' | 'circle' | 'triangle', dragStart, dragEnd, width, height, filled);
          ctx.fillStyle = currentPaintColor === '__eraser__' ? 'rgba(239, 68, 68, 0.6)' : currentPaintColor;
          ctx.globalAlpha = 0.65;
          for (const point of points) ctx.fillRect(origin.x + point.x * zoom, origin.y + point.y * zoom, zoom, zoom);
          ctx.globalAlpha = 1;
        }
      } else if (selection && activeTool === 'selection') {
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(origin.x + selection.left * zoom, origin.y + selection.top * zoom,
          (selection.right - selection.left + 1) * zoom, (selection.bottom - selection.top + 1) * zoom);
        ctx.setLineDash([]);
      }
    };

    // The service coalesces every change into a single repaint per animation frame.
    canvasService.subscribe(paint);

    const requestPaint = () => canvasService.notify();

    const updateModeButtons = () => {
      for (const [mode, active] of [['layer', targetsLayer()], ['move', movesArtwork()]] as const) {
        const button = root.querySelector<HTMLButtonElement>(`[data-canvas-mode="${mode}"]`);
        if (!button) continue;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      }
    };

    const updateCursor = () => {
      let next = activeTool === 'fill' ? 'cell' : activeTool === 'picker' ? 'copy' : 'crosshair';
      if (isDraggingReference) {
        next = 'grabbing';
      } else if (isMovingLayer) {
        next = 'grabbing';
      } else if (isDraggingLoosePixel) {
        next = 'grabbing';
      } else if (isSpaceHeld || isMousePanning) {
        next = isMousePanning ? 'grabbing' : 'grab';
      } else if (movesArtwork() && activeTool === 'selection') {
        next = 'move';
      } else if (movesArtwork() && targetsLayer()) {
        next = 'move';
      } else if (movesArtwork()) {
        const hover = canvasService.getHoverPixel();
        next = hover && getPaintLayerPixels?.()[`${hover.x},${hover.y}`] ? 'grab' : 'default';
      } else if (canvasService.isPivotMode()) {
        next = canvasService.findReferenceAt(canvasService.getHoverPixel()) ? 'grab' : 'copy';
      }
      if (next !== appliedCursor) {
        appliedCursor = next;
        root.style.cursor = next;
      }
    };

    const handleResetView = () => {
      canvasService.resetView(cssWidth, cssHeight);
    };

    const paintPixelAt = (x: number, y: number) => {
      currentStrokePixels.push({ x, y });
      canvasService.paintPixel(x, y, currentPaintColor === '__eraser__' ? null : currentPaintColor);
    };

    const fillAt = (pixel: { x: number; y: number }, color: string) => {
      const { width, height } = canvasService.getCanvasSize();
      const pixels = getFloodFillPixels(
        getPaintLayerPixels?.() || {}, pixel, width, height,
        color === '__eraser__' ? null : color
      );
      if (pixels.length) onPaintStroke?.(pixels, color);
    };

    const withinSelection = (pixel: { x: number; y: number }) => selection &&
      pixel.x >= selection.left && pixel.x <= selection.right && pixel.y >= selection.top && pixel.y <= selection.bottom;

    const selectedPixels = () => Object.fromEntries(Object.entries(getPaintLayerPixels?.() || {}).filter(([key]) => {
      const point = parsePixelKey(key);
      return point && withinSelection(point);
    }));

    const startTool = (pixel: { x: number; y: number }, color: string) => {
      if (isAllLayersSelected?.() && activeTool !== 'picker' && activeTool !== 'replace') return;
      currentPaintColor = color;
      if (activeTool === 'picker') {
        const picked = canvasService.getFramePixels()[`${pixel.x},${pixel.y}`];
        if (picked) onPickColor?.(picked);
      } else if (activeTool === 'replace') {
        onReplaceAt?.(pixel, color);
      } else if (activeTool === 'fill') {
        fillAt(pixel, color);
      } else if (activeTool === 'selection') {
        movingSelection = movesArtwork() && !!withinSelection(pixel);
        if (movesArtwork() && !movingSelection) return;
        dragStart = pixel;
        dragEnd = pixel;
        if (!movingSelection) selection = null;
        requestPaint();
      } else if (activeTool !== 'pencil') {
        dragStart = pixel;
        dragEnd = pixel;
        requestPaint();
      } else {
        isPainting = true;
        lastPaintedPixel = pixel;
        currentStrokePixels = [];
        paintPixelAt(pixel.x, pixel.y);
      }
    };

    const finishTool = () => {
      if (!dragStart || !dragEnd) return;
      const start = dragStart;
      const end = dragEnd;
      dragStart = null;
      dragEnd = null;
      if (activeTool === 'selection') {
        if (movingSelection && selection) {
          const dx = end.x - start.x;
          const dy = end.y - start.y;
          const { width, height } = canvasService.getCanvasSize();
          const source = selectedPixels();
          if (dx || dy) {
            onSelectionEdit?.((pixels: Record<string, string>) => {
              const result = { ...pixels };
              for (const key of Object.keys(source)) delete result[key];
              for (const [key, color] of Object.entries(source)) {
                const point = parsePixelKey(key);
                if (!point) continue;
                const x = point.x + dx;
                const y = point.y + dy;
                if (x >= 0 && y >= 0 && x < width && y < height) result[`${x},${y}`] = color;
              }
              return result;
            });
            selection = {
              left: Math.max(0, Math.min(width - 1, selection.left + dx)),
              right: Math.max(0, Math.min(width - 1, selection.right + dx)),
              top: Math.max(0, Math.min(height - 1, selection.top + dy)),
              bottom: Math.max(0, Math.min(height - 1, selection.bottom + dy)),
            };
          }
        } else {
          selection = { left: Math.min(start.x, end.x), right: Math.max(start.x, end.x),
            top: Math.min(start.y, end.y), bottom: Math.max(start.y, end.y) };
        }
        movingSelection = false;
      } else {
        const { width, height } = canvasService.getCanvasSize();
        const filled = !!root.closest('.app-container')?.querySelector<HTMLInputElement>('.shape-filled')?.checked;
        const pixels = getShapePixels(activeTool as 'line' | 'rectangle' | 'circle' | 'triangle', start, end, width, height, filled);
        if (pixels.length) onPaintStroke?.(pixels, currentPaintColor);
      }
      requestPaint();
    };

    const startMove = (pixel: { x: number; y: number }, clientX: number, clientY: number): boolean => {
      if (isAllLayersSelected?.() || !movesArtwork() || activeTool === 'selection') return false;
      if (targetsLayer()) {
        isMovingLayer = true;
        layerDragStartClient = { x: clientX, y: clientY };
        layerDragTotalDisplacement = { x: 0, y: 0 };
        onStartTranslateLayer?.();
      } else {
        if (!getPaintLayerPixels?.()[`${pixel.x},${pixel.y}`]) return true;
        isDraggingLoosePixel = true;
        draggedPixelStart = pixel;
        draggedPixelCurrent = pixel;
        onStartMovePixel?.(pixel.x, pixel.y);
      }
      updateCursor();
      requestPaint();
      return true;
    };

    const moveArtworkTo = (clientX: number, clientY: number) => {
      if (isMovingLayer) {
        const zoom = canvasService.getZoom();
        const totalDx = Math.round((clientX - layerDragStartClient.x) / zoom);
        const totalDy = Math.round((clientY - layerDragStartClient.y) / zoom);
        const stepDx = totalDx - layerDragTotalDisplacement.x;
        const stepDy = totalDy - layerDragTotalDisplacement.y;
        if (stepDx || stepDy) {
          layerDragTotalDisplacement = { x: totalDx, y: totalDy };
          onTranslateLayer?.(stepDx, stepDy, false);
        }
      } else if (isDraggingLoosePixel) {
        const pixel = canvasService.getSpritePixelAtPointer(clientX, clientY, viewRect);
        if (pixel && (pixel.x !== draggedPixelCurrent.x || pixel.y !== draggedPixelCurrent.y)) {
          draggedPixelCurrent = pixel;
          onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, pixel.x, pixel.y, false);
        }
      }
    };

    const paintLineTo = (pixel: { x: number; y: number }) => {
      const points = lastPaintedPixel
        ? getLinePixels(lastPaintedPixel.x, lastPaintedPixel.y, pixel.x, pixel.y)
        : [pixel];
      for (const point of points) {
        paintPixelAt(point.x, point.y);
      }
      lastPaintedPixel = pixel;
    };

    const commitStroke = () => {
      if (!isPainting) return;
      isPainting = false;
      if (currentStrokePixels.length > 0) {
        onPaintStroke?.(currentStrokePixels, currentPaintColor);
        currentStrokePixels = [];
      }
      lastPaintedPixel = null;
    };

    // Match the backing store to the element size, at device resolution.
    const resizeObserver = new ResizeObserver((entries) => {
      for (const entry of entries) {
        const { width, height } = entry.contentRect;
        if (width > 0 && height > 0) {
          resizeSurface(width, height);
          requestPaint();
        }
      }
    });
    resizeObserver.observe(root);
    resizeSurface(viewRect.width || root.clientWidth, viewRect.height || root.clientHeight);

    window.addEventListener('resize', refreshViewRect, listen);
    window.addEventListener('scroll', refreshViewRect, { passive: true, capture: true, signal: teardown.signal });

    // Keyboard modifiers
    window.addEventListener('keydown', (e: KeyboardEvent) => {
      let changed = false;
      if (e.key === 'Shift' && !isShiftHeld) {
        isShiftHeld = true;
        changed = true;
      }
      if (e.key === 'Control' && !isCtrlHeld) {
        isCtrlHeld = true;
        changed = true;
      }
      if ((e.key === 'Meta' || e.metaKey) && !isCmdHeld) {
        isCmdHeld = true;
        changed = true;
      }
      if (e.key === 'Alt' && !isAltHeld) {
        isAltHeld = true;
        changed = true;
      }
      if (e.code === 'Space' && !isSpaceHeld) {
        if (!(e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement || e.target instanceof HTMLSelectElement)) {
          isSpaceHeld = true;
          changed = true;
        }
      }
      if (changed) {
        updateModeButtons();
        updateCursor();
        requestPaint();
      }
    }, listen);

    window.addEventListener('keyup', (e: KeyboardEvent) => {
      let changed = false;
      if (e.key === 'Shift') {
        isShiftHeld = false;
        changed = true;
      }
      if (e.key === 'Control') {
        isCtrlHeld = false;
        changed = true;
      }
      if (e.key === 'Meta') {
        isCmdHeld = false;
        changed = true;
      }
      if (e.key === 'Alt') {
        isAltHeld = false;
        changed = true;
      }
      if (e.code === 'Space') {
        isSpaceHeld = false;
        changed = true;
      }
      if (changed) {
        updateModeButtons();
        updateCursor();
        requestPaint();
      }
    }, listen);

    window.addEventListener('blur', () => {
      isShiftHeld = false;
      isCtrlHeld = false;
      isCmdHeld = false;
      isAltHeld = false;
      isMouseDown = false;
      isMousePanning = false;
      isSpaceHeld = false;
      isDraggingLoosePixel = false;
      updateModeButtons();
      updateCursor();
      requestPaint();
    }, listen);

    // Touch handlers
    root.addEventListener(
      'touchstart',
      (e: TouchEvent) => {
        refreshViewRect();
        if (e.touches.length === 2) {
          e.preventDefault();
          isTwoFingerGesture = true;
          isPainting = false;
          dragStart = null;
          dragEnd = null;
          initialTouchDistance = getTouchDistance(e.touches[0], e.touches[1]);
          initialTouchZoom = canvasService.getZoom();
          lastTouchMidpoint = getTouchMidpoint(e.touches[0], e.touches[1]);
        } else if (e.touches.length === 1 && !isTwoFingerGesture) {
          const pixel = canvasService.getSpritePixelAtPointer(e.touches[0].clientX, e.touches[0].clientY, viewRect);
          if (pixel) {
            if (!startMove(pixel, e.touches[0].clientX, e.touches[0].clientY)) {
              startTool(pixel, canvasService.getColors().primary);
            }
          }
        }
      },
      { passive: false, signal: teardown.signal }
    );

    root.addEventListener(
      'touchmove',
      (e: TouchEvent) => {
        if (isTwoFingerGesture && e.touches.length === 2) {
          e.preventDefault();
          const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
          if (initialTouchDistance > 0) {
            canvasService.setZoom(initialTouchZoom * (currentDist / initialTouchDistance));
          }

          const currentMid = getTouchMidpoint(e.touches[0], e.touches[1]);
          if (lastTouchMidpoint) {
            canvasService.pan(currentMid.x - lastTouchMidpoint.x, currentMid.y - lastTouchMidpoint.y);
          }
          lastTouchMidpoint = currentMid;
        } else if ((isMovingLayer || isDraggingLoosePixel) && e.touches.length === 1) {
          e.preventDefault();
          moveArtworkTo(e.touches[0].clientX, e.touches[0].clientY);
        } else if (isPainting && e.touches.length === 1) {
          e.preventDefault();
          const pixel = canvasService.getSpritePixelAtPointer(e.touches[0].clientX, e.touches[0].clientY, viewRect);
          if (pixel) {
            paintLineTo(pixel);
          }
        } else if (dragStart && e.touches.length === 1) {
          e.preventDefault();
          const pixel = canvasService.getSpritePixelAtPointer(e.touches[0].clientX, e.touches[0].clientY, viewRect);
          if (pixel) { dragEnd = pixel; requestPaint(); }
        }
      },
      { passive: false, signal: teardown.signal }
    );

    const endTouch = () => {
      if (isMovingLayer) { isMovingLayer = false; onTranslateLayer?.(0, 0, true); }
      if (isDraggingLoosePixel) {
        isDraggingLoosePixel = false;
        onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, draggedPixelCurrent.x, draggedPixelCurrent.y, true);
      }
      commitStroke();
      if (!isTwoFingerGesture) finishTool();
      isTwoFingerGesture = false;
      lastTouchMidpoint = null;
    };
    root.addEventListener('touchend', endTouch, listen);
    root.addEventListener('touchcancel', endTouch, listen);

    // Wheel: scroll pans, Ctrl/Cmd + scroll zooms around the pointer.
    root.addEventListener(
      'wheel',
      (e: WheelEvent) => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
          refreshViewRect();
          canvasService.zoomAtPoint(Math.exp(-e.deltaY * 0.02), e.clientX, e.clientY, viewRect);
        } else {
          canvasService.pan(-e.deltaX, -e.deltaY);
        }
      },
      { passive: false, signal: teardown.signal }
    );

    // Mouse interactions
    root.addEventListener('mousedown', (e: MouseEvent) => {
      refreshViewRect();
      isMouseDown = true;
      isShiftHeld = e.shiftKey;
      isCtrlHeld = e.ctrlKey;
      isCmdHeld = e.metaKey;
      isAltHeld = e.altKey;
      updateModeButtons();

      // Reference editing owns the primary pointer gesture while active.
      if (!isAllLayersSelected?.() && canvasService.isPivotMode() && e.button === 0) {
        e.preventDefault();
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        const existingReferenceId = canvasService.findReferenceAt(pixel);
        if (pixel && onStartMoveReference?.(pixel.x, pixel.y) !== false) {
          isDraggingReference = true;
          draggedReferenceCurrent = { x: pixel.x, y: pixel.y };
          referenceDragMoved = false;
          referenceDragStartedExisting = !!existingReferenceId;
          updateCursor();
        }
        return;
      }

      // Space or middle click: pan the canvas.
      if (isSpaceHeld || e.button === 1) {
        e.preventDefault();
        isMousePanning = true;
        mousePanStart = { x: e.clientX, y: e.clientY };
        updateCursor();
        return;
      }

      if (e.button === 0 || e.button === 2) {
        e.preventDefault();
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        if (pixel) {
          if (e.button === 0 && startMove(pixel, e.clientX, e.clientY)) return;
          const colors = canvasService.getColors();
          startTool(pixel, e.button === 2 ? colors.secondary : colors.primary);
        }
      }
    }, listen);

    window.addEventListener('mousemove', (e: MouseEvent) => {
      isShiftHeld = e.shiftKey;
      isCtrlHeld = e.ctrlKey;
      isCmdHeld = e.metaKey;
      isAltHeld = e.altKey;
      updateModeButtons();

      if (isDraggingReference) {
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        if (pixel && (pixel.x !== draggedReferenceCurrent.x || pixel.y !== draggedReferenceCurrent.y)) {
          draggedReferenceCurrent = { x: pixel.x, y: pixel.y };
          referenceDragMoved = true;
          onMoveReference?.(pixel.x, pixel.y, false);
        }
        return;
      }

      if (isMovingLayer) {
        moveArtworkTo(e.clientX, e.clientY);
        return;
      }

      if (isMousePanning) {
        canvasService.pan(e.clientX - mousePanStart.x, e.clientY - mousePanStart.y);
        mousePanStart = { x: e.clientX, y: e.clientY };
        return;
      }

      if (isDraggingLoosePixel) {
        moveArtworkTo(e.clientX, e.clientY);
        return;
      }

      if (isPainting) {
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        if (pixel && (!lastPaintedPixel || lastPaintedPixel.x !== pixel.x || lastPaintedPixel.y !== pixel.y)) {
          paintLineTo(pixel);
          canvasService.setHoverPixel(pixel);
        }
        return;
      }

      if (dragStart) {
        const pixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
        if (pixel && (pixel.x !== dragEnd?.x || pixel.y !== dragEnd?.y)) {
          dragEnd = pixel;
          requestPaint();
        }
        return;
      }

      const hoverPixel = canvasService.getSpritePixelAtPointer(e.clientX, e.clientY, viewRect);
      canvasService.setHoverPixel(hoverPixel);
      canvasService.setHoveredReference(canvasService.isPivotMode() ? canvasService.findReferenceAt(hoverPixel) : null);
      updateCursor();
    }, listen);

    root.addEventListener('mouseleave', () => {
      if (isDraggingReference) {
        isDraggingReference = false;
        onMoveReference?.(draggedReferenceCurrent.x, draggedReferenceCurrent.y, true, true, referenceDragStartedExisting);
        updateCursor();
      }
      if (isMovingLayer) {
        isMovingLayer = false;
        onTranslateLayer?.(0, 0, true);
        updateCursor();
        requestPaint();
      }
      if (isDraggingLoosePixel) {
        isDraggingLoosePixel = false;
        onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, draggedPixelCurrent.x, draggedPixelCurrent.y, true);
        updateCursor();
      }
      canvasService.setHoverPixel(null);
      canvasService.setHoveredReference(null);
    }, listen);

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      if (isDraggingReference) {
        isDraggingReference = false;
        onMoveReference?.(
          draggedReferenceCurrent.x,
          draggedReferenceCurrent.y,
          true,
          referenceDragMoved,
          referenceDragStartedExisting
        );
      }
      if (isMovingLayer) {
        isMovingLayer = false;
        onTranslateLayer?.(0, 0, true);
        updateCursor();
        requestPaint();
      }

      if (isMousePanning) {
        isMousePanning = false;
      }

      if (isDraggingLoosePixel) {
        isDraggingLoosePixel = false;
        onMovePixel?.(draggedPixelStart.x, draggedPixelStart.y, draggedPixelCurrent.x, draggedPixelCurrent.y, true);
      }

      commitStroke();
      finishTool();
      updateCursor();
    }, listen);

    root.addEventListener('contextmenu', (e: MouseEvent) => {
      e.preventDefault();
    }, listen);

    root.addEventListener('dblclick', () => {
      handleResetView();
    }, listen);

    const resetBtn = root.querySelector('.btn-reset-view');
    if (resetBtn) {
      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        handleResetView();
      }, listen);
    }

    root.querySelectorAll<HTMLButtonElement>('[data-canvas-mode]').forEach((button) => {
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        if (isAllLayersSelected?.()) return;
        if (button.dataset.canvasMode === 'layer') layerTarget = !layerTarget;
        else moveMode = !moveMode;
        updateModeButtons();
        updateCursor();
        requestPaint();
      }, listen);
    });

    const toolButtons = root.closest('.app-container')?.querySelectorAll<HTMLButtonElement>('[data-paint-tool]');
    const shapePicker = root.closest('.app-container')?.querySelector<HTMLElement>('.shape-picker');
    const shapeTrigger = shapePicker?.querySelector<HTMLButtonElement>('.shape-trigger');
    const shapeToggle = shapePicker?.querySelector<HTMLButtonElement>('.shape-menu-toggle');
    const shapeMenu = shapePicker?.querySelector<HTMLElement>('.shape-menu');
    let lastShape: PaintTool = 'rectangle';
    const closeShapeMenu = () => {
      if (shapeMenu) shapeMenu.hidden = true;
      shapeToggle?.setAttribute('aria-expanded', 'false');
    };
    const selectTool = (tool: PaintTool) => {
      commitStroke();
      dragStart = null;
      dragEnd = null;
      selection = null;
      activeTool = tool;
      toolButtons?.forEach((toolButton) => {
        const selected = toolButton.dataset.paintTool === tool;
        toolButton.classList.toggle('is-active', selected);
        toolButton.setAttribute('aria-pressed', String(selected));
      });
      if (shapeTrigger) {
        const isShape = ['line', 'rectangle', 'circle', 'triangle'].includes(tool);
        if (isShape) {
          lastShape = tool;
          shapeTrigger.dataset.shape = tool;
          const choice = shapeMenu?.querySelector<HTMLButtonElement>(`[data-shape-choice="${tool}"]`);
          shapeTrigger.title = choice?.textContent?.trim() || tool;
          shapeTrigger.setAttribute('aria-label', shapeTrigger.title);
          shapeTrigger.querySelectorAll<HTMLElement>('[data-shape-icon]').forEach((icon) => {
            icon.hidden = icon.dataset.shapeIcon !== tool;
          });
        }
        shapeTrigger.classList.toggle('is-active', isShape);
        shapeTrigger.setAttribute('aria-pressed', String(isShape));
      }
      closeShapeMenu();
      updateCursor();
      requestPaint();
    };
    toolButtons?.forEach((button) => {
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        selectTool(button.dataset.paintTool as PaintTool);
      }, listen);
    });
    shapeTrigger?.addEventListener('click', () => selectTool(lastShape), listen);
    shapeToggle?.addEventListener('click', () => {
      if (!shapeMenu) return;
      shapeMenu.hidden = !shapeMenu.hidden;
      shapeToggle.setAttribute('aria-expanded', String(!shapeMenu.hidden));
    }, listen);
    shapeMenu?.querySelectorAll<HTMLButtonElement>('[data-shape-choice]').forEach((button) => {
      button.addEventListener('click', () => selectTool(button.dataset.shapeChoice as PaintTool), listen);
    });
    window.addEventListener('click', (event) => {
      if (shapePicker && !shapePicker.contains(event.target as Node)) closeShapeMenu();
    }, listen);
    shapePicker?.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { closeShapeMenu(); shapeToggle?.focus(); }
    }, listen);

    const editorRoot = root.closest('.app-container');
    editorRoot?.querySelectorAll<HTMLButtonElement>('[data-selection-action]').forEach((button) => {
      button.addEventListener('click', () => {
        if (activeTool !== 'selection' || !selection) return;
        const action = button.dataset.selectionAction;
        if (action === 'copy' || action === 'cut') {
          clipboard = selectedPixels();
          clipboardOrigin = { x: selection.left, y: selection.top };
        }
        if (action === 'delete' || action === 'cut') {
          const keys = Object.keys(selectedPixels());
          if (keys.length) onSelectionEdit?.((pixels: Record<string, string>) => {
            const result = { ...pixels };
            for (const key of keys) delete result[key];
            return result;
          });
        }
        if (action === 'paste' && Object.keys(clipboard).length) {
          const offsetX = selection.left - clipboardOrigin.x;
          const offsetY = selection.top - clipboardOrigin.y;
          const { width, height } = canvasService.getCanvasSize();
          onSelectionEdit?.((pixels: Record<string, string>) => {
            const result = { ...pixels };
            for (const [key, color] of Object.entries(clipboard)) {
              const point = parsePixelKey(key);
              if (!point) continue;
              const x = point.x + offsetX;
              const y = point.y + offsetY;
              if (x >= 0 && x < width && y >= 0 && y < height) result[`${x},${y}`] = color;
            }
            return result;
          });
        }
        requestPaint();
      }, listen);
    });

    // Exposed on the component store so a host that unmounts the stage can release
    // every window listener it registered.
    dispose = () => {
      teardown.abort();
      resizeObserver.disconnect();
    };
  }
</script>

<div class="canvas-stage-root">
  <canvas class="stage-canvas-full"></canvas>

  <div class="canvas-hud-overlay">
    <div class="hud-left">
      <span class="hud-zoom-badge">{{ Math.round(curZoom) }}x</span>
      <button class="btn-hud-tool btn-reset-view" :title="t('canvas.reset_title')">{{ t('canvas.reset') }}</button>
    </div>
    <div class="hud-hint">{{ t('canvas.hint') }}</div>
  </div>
  <div class="canvas-mode-controls" role="group" :aria-label="t('canvas.mode_controls')">
    <button type="button" class="btn-canvas-mode" data-canvas-mode="layer" aria-pressed="false" :title="t('canvas.layer_mode_title')" :aria-label="t('canvas.layer_mode_title')"><Icon name="layers" :size="18" /></button>
    <button type="button" class="btn-canvas-mode" data-canvas-mode="move" aria-pressed="false" :title="t('canvas.move_mode_title')" :aria-label="t('canvas.move_mode_title')"><Icon name="move" :size="18" /></button>
  </div>
</div>
