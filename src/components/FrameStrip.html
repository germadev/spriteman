<script :setup="{
  t,
  selectedFrame,
  totalFrames,
  isPlaying,
  onionSkin,
  spriteWidth,
  spriteHeight,
  framePixels,
  frameRevisions,
  frameEpoch,
  animations,
  activeAnimationId,
  layerGroups,
  activeGroup,
  isPivotMode,
  canUndo,
  canRedo,
  onSelectFrame,
  onAddFrame,
  onReorderFrame,
  onDuplicateFrame,
  onDeleteFrame,
  onTogglePlay,
  onToggleOnionSkin,
  onStep,
  onLinkFrames,
  onChangeGroupIntermediateCount,
  onUngroupFrames,
  onToggleGroupReferenceMode,
  onRemoveGroupReferencePoint,
  onUndo,
  onRedo,
  onSelectAnimation,
  onAddAnimation,
  onRequestRenameAnimation,
  onDeleteAnimation
}" type="text/typescript">
  const _d = (module: any) => module?.default ?? module;
  const Icon = _d(await import('./Icon.html'));

  let draggingIndex: number | null = null;
  let isDraggingNew = false;
  let insertSlotIndex: number | null = null;
  let openFrameCountGroupId: string | null = null;
  let openFrameCountValue = 1;
  let frameCountDropupStyle = '';

  // Thumbnail canvas & memoization
  let thumbCanvas: HTMLCanvasElement | null = null;
  const thumbCache = new Map<string, string>();

  /**
   * Thumbnails are cached by the frame's content revision, which the project service
   * bumps whenever that frame changes. The previous key (pixel count + first color)
   * missed edits that repainted a pixel without changing the count.
   */
  const getThumbnail = (i: number, pixelsMap: any, w: number, h: number, revision: number, epoch: number): string => {
    const key = `${epoch || 0}_${i}_${w || 64}x${h || 64}_r${revision}`;
    const cached = thumbCache.get(key);
    if (cached !== undefined) return cached;

    const pixels = (pixelsMap && pixelsMap[i]) || {};
    const keys = Object.keys(pixels);

    if (!thumbCanvas) {
      thumbCanvas = document.createElement('canvas');
      thumbCanvas.width = 44;
      thumbCanvas.height = 44;
    }
    const ctx = thumbCanvas.getContext('2d');
    if (!ctx) return '';
    ctx.clearRect(0, 0, 44, 44);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 44, 44);

    const targetW = Math.max(1, w || 64);
    const targetH = Math.max(1, h || 64);
    const scaleX = 44 / targetW;
    const scaleY = 44 / targetH;
    ctx.imageSmoothingEnabled = false;

    for (let k = 0; k < keys.length; k++) {
      const coord = keys[k];
      const comma = coord.indexOf(',');
      if (comma === -1) continue;
      const x = parseInt(coord.slice(0, comma), 10);
      const y = parseInt(coord.slice(comma + 1), 10);
      ctx.fillStyle = pixels[coord];
      ctx.fillRect(Math.floor(x * scaleX), Math.floor(y * scaleY), Math.ceil(scaleX), Math.ceil(scaleY));
    }

    const dataUrl = thumbCanvas.toDataURL();
    // Keep the cache bounded; stale revisions are never looked up again.
    if (thumbCache.size > 512) thumbCache.clear();
    thumbCache.set(key, dataUrl);
    return dataUrl;
  };

  $: maxFrames = Math.max(1, totalFrames || 1);
  $: activeInt = Math.max(0, Math.min(maxFrames - 1, Math.floor(selectedFrame || 0)));
  $: animList = animations || [];
  $: currentGroupList = layerGroups || [];
  $: frameIndicatorText = t('timeline.frame_indicator', { current: activeInt + 1, total: maxFrames });

  const getAnimIcon = (name: string): string => {
    const lower = (name || '').toLowerCase();
    if (lower.includes('walk') || lower.includes('run')) return 'footprints';
    if (lower.includes('jump') || lower.includes('hurt') || lower.includes('die')) return 'zap';
    if (lower.includes('attack') || lower.includes('slash')) return 'swords';
    return 'film';
  };

  const handleSelectAnim = (id: string) => {
    onSelectAnimation?.(id);
  };

  const handleRenameAnim = (a: any) => {
    if (a.id) onRequestRenameAnimation?.(a.id, a.name || '');
  };

  const handleToggleOnion = () => {
    onToggleOnionSkin?.(!onionSkin);
  };

  // Build reactive reel items
  const canLinkBetween = (startIndex: number): boolean =>
    startIndex >= 0 &&
    startIndex < maxFrames - 1 &&
    !currentGroupList.some((group: any) =>
      (startIndex >= group.start_frame && startIndex <= group.end_frame) ||
      (startIndex + 1 >= group.start_frame && startIndex + 1 <= group.end_frame)
    );

  const buildCellData = (i: number, cellGroup: any, isIntermediate: boolean) => {
    const inGroup = !!cellGroup;
    const isGroupStart = inGroup && i === cellGroup.start_frame;
    const isGroupEnd = inGroup && i === cellGroup.end_frame;
    const referenceCount = inGroup ? (cellGroup.reference_points?.length || (cellGroup.pivot ? 1 : 0)) : 0;

    return {
      index: i,
      inGroup,
      isGroupStart,
      isGroupEnd,
      isIntermediate,
      referenceCount,
      canLinkBefore: canLinkBetween(i - 1),
      canLinkAfter: canLinkBetween(i),
      thumb: getThumbnail(i, framePixels, spriteWidth, spriteHeight, (frameRevisions || [])[i] || 0, frameEpoch),
      title: isIntermediate
        ? t('timeline.cell_intermediate_title', {
            number: i + 1,
            group: cellGroup?.name || t('timeline.group_default_name'),
          })
        : inGroup && referenceCount > 0
        ? t('timeline.cell_in_group_references_title', {
            number: i + 1,
            group: cellGroup?.name || t('timeline.group_default_name'),
          count: referenceCount,
          })
        : inGroup
        ? t('timeline.cell_in_group_title', {
            number: i + 1,
            group: cellGroup?.name || t('timeline.group_default_name'),
          })
        : t('timeline.cell_title', { number: i + 1 })
    };
  };

  $: reelItems = (() => {
    const items: any[] = [];
    const count = totalFrames || 1;
    let idx = 0;
    while (idx < count) {
      const matchingGroup = currentGroupList.find(
        (g: any) => idx > g.start_frame && idx < g.end_frame
      );

      if (matchingGroup && idx === matchingGroup.start_frame + 1) {
        const intermediateCells: any[] = [];
        while (idx < matchingGroup.end_frame && idx < count) {
          intermediateCells.push(buildCellData(idx, matchingGroup, true));
          idx++;
        }
        items.push({
          type: 'group',
          key: `grp_${matchingGroup.id}`,
          group: matchingGroup,
          isGroupActive: activeGroup?.id === matchingGroup.id,
          cells: intermediateCells,
          middleCell: intermediateCells[Math.floor(intermediateCells.length / 2)],
          stackCards: Array.from({ length: Math.min(3, intermediateCells.length) }, (_, index) => index)
        });
      } else {
        const cellGroup = currentGroupList.find((g: any) => idx >= g.start_frame && idx <= g.end_frame);
        items.push({
          type: 'single',
          key: `frm_${idx}`,
          cell: buildCellData(idx, cellGroup, false)
        });
        idx++;
      }
    }
    return items;
  })();

  const handleCellClick = (i: number) => {
    if (draggingIndex !== null || isDraggingNew) return;
    onSelectFrame?.(i);
  };

  const openIntermediateCount = (e: Event, groupId: string, currentValue: number) => {
    const rect = (e.currentTarget as HTMLElement).getBoundingClientRect();
    openFrameCountGroupId = groupId;
    openFrameCountValue = currentValue;
    frameCountDropupStyle = `left: ${rect.left + rect.width / 2}px; top: ${rect.top - 5}px;`;
    window.setTimeout(() => {
      const input = document.querySelector('.group-frame-count-dropup-input') as HTMLInputElement | null;
      input?.focus();
      input?.select();
    }, 0);
  };

  const commitIntermediateCount = (close = false) => {
    if (!openFrameCountGroupId) return;
    openFrameCountValue = Math.max(1, Math.min(120, Math.floor(openFrameCountValue) || 1));
    onChangeGroupIntermediateCount?.(openFrameCountGroupId, openFrameCountValue);
    if (close) openFrameCountGroupId = null;
  };

  const adjustIntermediateCount = (delta: number) => {
    openFrameCountValue = Math.max(1, Math.min(120, openFrameCountValue + delta));
  };

  const handleDropupCountInput = (e: Event) => {
    openFrameCountValue = parseInt((e.target as HTMLInputElement).value, 10) || 1;
  };

  const handleIntermediateCountKeydown = (e: KeyboardEvent) => {
    if (e.key === 'Enter') {
      commitIntermediateCount(true);
    } else if (e.key === 'Escape') {
      openFrameCountGroupId = null;
    }
  };

  const handleEditReferences = () => {
    onToggleGroupReferenceMode?.();
  };

  const handleUngroup = (groupId: string) => {
    onUngroupFrames?.(groupId);
  };

  // Drag and drop handlers
  const handleCellDragStart = (e: DragEvent, i: number) => {
    draggingIndex = i;
    if (e.dataTransfer) {
      e.dataTransfer.setData('application/json', JSON.stringify({ type: 'reorder', fromIndex: i }));
      e.dataTransfer.effectAllowed = 'move';
    }
  };

  const handleNewDragStart = (e: DragEvent) => {
    isDraggingNew = true;
    if (e.dataTransfer) {
      e.dataTransfer.setData('application/json', JSON.stringify({ type: 'new' }));
      e.dataTransfer.effectAllowed = 'copy';
    }
  };

  const cleanupDrag = () => {
    draggingIndex = null;
    isDraggingNew = false;
    insertSlotIndex = null;
  };

  const handleCellDragOver = (e: DragEvent, i: number) => {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = isDraggingNew ? 'copy' : 'move';
    const target = e.currentTarget as HTMLElement;
    if (!target) return;
    const rect = target.getBoundingClientRect();
    const isRightHalf = e.clientX > rect.left + rect.width / 2;
    insertSlotIndex = isRightHalf ? i + 1 : i;
  };

  const handleCellDrop = (e: DragEvent, i: number) => {
    const target = e.currentTarget as HTMLElement;
    const rect = target.getBoundingClientRect();
    const slot = e.clientX > rect.left + rect.width / 2 ? i + 1 : i;
    insertSlotIndex = slot;
    handleDrop(e, slot);
  };

  const handleReelDragOver = (e: DragEvent) => {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = isDraggingNew ? 'copy' : 'move';
    const reel = e.currentTarget as HTMLElement;
    const cells = Array.from(reel.querySelectorAll<HTMLElement>('.frame-cell[data-frame-index]'));
    let nearestSlot = totalFrames || 1;
    for (const cell of cells) {
      const frameIndex = parseInt(cell.dataset.frameIndex || '', 10);
      if (!Number.isFinite(frameIndex)) continue;
      const rect = cell.getBoundingClientRect();
      if (e.clientX <= rect.left + rect.width / 2) {
        nearestSlot = frameIndex;
        break;
      }
      nearestSlot = frameIndex + 1;
    }
    insertSlotIndex = nearestSlot;
  };

  const handleReelDragLeave = (e: DragEvent) => {
    const target = e.currentTarget as HTMLElement;
    if (target && !target.contains(e.relatedTarget as Node)) {
      insertSlotIndex = null;
    }
  };

  const handleDrop = (e: DragEvent, resolvedSlot?: number) => {
    e.preventDefault();
    e.stopPropagation();
    const insertAt = typeof resolvedSlot === 'number' ? resolvedSlot : insertSlotIndex;
    let dragData: { type: string; fromIndex?: number } | null = null;
    try {
      const raw = e.dataTransfer?.getData('application/json');
      if (raw) dragData = JSON.parse(raw);
    } catch {
      // ignore
    }

    const wasDraggingIdx = draggingIndex;
    const wasDraggingNew = isDraggingNew;
    cleanupDrag();

    if (dragData?.type === 'reorder' || typeof wasDraggingIdx === 'number') {
      const from = dragData?.fromIndex ?? wasDraggingIdx!;
      let to = typeof insertAt === 'number' ? insertAt : (totalFrames || 1) - 1;
      if (from < to) {
        to = to - 1;
      }
      to = Math.max(0, Math.min((totalFrames || 1) - 1, to));
      if (from !== to) {
        onReorderFrame?.(from, to);
      }
    } else if (dragData?.type === 'new' || wasDraggingNew) {
      if (typeof insertAt === 'number') {
        onAddFrame?.(insertAt);
      } else {
        onAddFrame?.();
      }
    }
  };
</script>

<div class="framestrip-container">
  <!-- Animation tabs strip -->
  <div class="animation-tabs-strip">
    <div class="anim-tabs-list">
      <button
        :each="a in animList"
        :key="a.id"
        class="btn-anim-tab"
        :class="{ active: a.id === activeAnimationId }"
        :title="t('timeline.animation_tab_title', { name: a.name, frames: a.total_frames })"
        @click="handleSelectAnim(a.id)"
        @dblclick="handleRenameAnim(a)"
      >
        <span class="anim-tab-icon"><Icon :name="getAnimIcon(a.name)" :size="14" /></span>
        <span class="anim-tab-name">{{ a.name }}</span>
        <span class="anim-tab-badge">{{ t('timeline.animation_badge', { frames: a.total_frames }) }}</span>
      </button>
    </div>
    <button
      class="btn-anim-tab-new"
      :title="t('timeline.new_animation_title')"
      @click="onAddAnimation?.()"
    ><Icon name="plus" :size="13" />{{ t('timeline.new_animation') }}</button>
  </div>

  <!-- Timeline Controls Toolbar -->
  <div class="framestrip-toolbar">
    <div class="transport-group">
      <button
        class="btn-tool btn-play"
        :class="{ active: isPlaying }"
        :title="t('timeline.play_title')"
        @click="onTogglePlay?.()"
      >
        <Icon :if="isPlaying" name="pause" :size="13" />
        <Icon :else name="play" :size="13" />
        <span>{{ isPlaying ? t('timeline.pause') : t('timeline.play') }}</span>
      </button>
      <button class="btn-tool icon-only btn-prev" :title="t('timeline.prev_title')" @click="onStep?.(-1)"><Icon name="skip-back" :size="14" /></button>
      <button class="btn-tool icon-only btn-next" :title="t('timeline.next_title')" @click="onStep?.(1)"><Icon name="skip-forward" :size="14" /></button>
    </div>

    <div class="history-actions-group">
      <button
        class="btn-tool icon-only btn-undo"
        :class="{ disabled: !canUndo }"
        :disabled="!canUndo"
        :title="t('timeline.undo_title')"
        @click="onUndo?.()"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>
      <button
        class="btn-tool icon-only btn-redo"
        :class="{ disabled: !canRedo }"
        :disabled="!canRedo"
        :title="t('timeline.redo_title')"
        @click="onRedo?.()"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7v6h-6"></path>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
        </svg>
      </button>
    </div>

    <div class="frame-actions-group">
      <button
        class="btn-tool icon-only btn-duplicate"
        :title="t('timeline.duplicate_title')"
        @click="onDuplicateFrame?.()"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
      <button
        class="btn-tool icon-only btn-delete"
        :class="{ disabled: (totalFrames || 1) <= 1 }"
        :disabled="(totalFrames || 1) <= 1"
        :title="t('timeline.delete_title')"
        @click="onDeleteFrame?.()"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
      <button
        class="btn-tool icon-only btn-onion"
        :class="{ active: onionSkin }"
        :title="t('timeline.onion_title')"
        @click="handleToggleOnion()"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C12 2 8 6 8 6C5.5 8.5 4 11.5 4 14.5C4 19 7.6 22 12 22C16.4 22 20 19 20 14.5C20 11.5 18.5 8.5 16 6L12 2Z"></path>
          <path d="M12 6C12 6 9.5 9 9.5 9C8 10.5 7 12.5 7 14.5C7 17.5 9.2 19.5 12 19.5C14.8 19.5 17 17.5 17 14.5C17 12.5 16 10.5 14.5 9L12 6Z" opacity="0.5"></path>
        </svg>
      </button>

    </div>

    <div class="frame-indicator">
      <span>{{ frameIndicatorText }}</span>
    </div>
  </div>

  <!-- Frames Reel -->
  <div
    class="frames-reel"
    :class="{ 'reel-drag-active': draggingIndex !== null || isDraggingNew }"
    @dragover="handleReelDragOver($event)"
    @dragleave="handleReelDragLeave($event)"
    @drop="handleDrop($event)"
  >
    <div :each="item in reelItems" :key="item.key" class="reel-item"
      :class="{
        'drop-slot-before': item.type === 'single' && insertSlotIndex === item.cell.index,
        'drop-slot-after': item.type === 'single' && insertSlotIndex === item.cell.index + 1
      }">
      <!-- Group intermediate block -->
      <div :if="item.type === 'group'" class="group-intermediate-wrapper">
        <div
          class="active-group-pill in-reel"
          :class="{ active: item.isGroupActive }"
          @click="onSelectFrame?.(item.group.start_frame)"
        >
          <span class="group-pill-zap" :title="t('timeline.group_pill_title', { name: item.group.name || t('timeline.group_default_name'), from: item.group.start_frame + 1, to: item.group.end_frame + 1 })">
            <Icon name="zap" :size="12" />
          </span>
          <div class="group-pill-actions">
            <button
              class="btn-group-action btn-group-reference"
              :class="{ active: isPivotMode && item.isGroupActive }"
              :title="t('timeline.edit_references')"
              @click.stop="handleEditReferences()"
            >
              <Icon name="map-pin" :size="12" />
            </button>
            <span class="group-frame-count-control">
            <button class="group-frame-count-trigger" type="button"
              :title="t('timeline.intermediate_count')"
              @click.stop="openIntermediateCount($event, item.group.id, item.group.end_frame - item.group.start_frame - 1)">
              {{ item.group.end_frame - item.group.start_frame - 1 }}
            </button>
            </span>
            <button type="button" class="btn-group-action btn-group-ungroup" :title="t('timeline.ungroup')"
              @click.stop="handleUngroup(item.group.id)">
              <Icon name="x" :size="12" />
            </button>
          </div>
        </div>

        <div class="group-intermediate-stack" :class="`stack-${item.stackCards.length}`"
          :title="item.middleCell.title">
          <div
            :each="stackIndex in item.stackCards"
            :key="stackIndex"
            class="group-stack-card"
            :class="{ active: activeInt > item.group.start_frame && activeInt < item.group.end_frame }"
          >
            <img class="cell-thumb-canvas" :src="item.middleCell.thumb" width="44" height="44" alt="Thumb" />
          </div>
        </div>
      </div>

      <!-- Single frame cell -->
      <button
        :else
        class="frame-cell"
        :class="{
          active: item.cell.index === activeInt,
          'in-group': item.cell.inGroup,
          'group-start': item.cell.isGroupStart,
          'group-end': item.cell.isGroupEnd,
          'is-dragging': draggingIndex === item.cell.index
        }"
        :data-frame-index="String(item.cell.index)"
        draggable="true"
        :title="item.cell.title"
        @click="handleCellClick(item.cell.index)"
        @dragstart="handleCellDragStart($event, item.cell.index)"
        @dragend="cleanupDrag()"
        @dragover="handleCellDragOver($event, item.cell.index)"
        @drop="handleCellDrop($event, item.cell.index)"
      >
        <span class="cell-num">{{ item.cell.index + 1 }}</span>
        <span :if="item.cell.referenceCount > 0" class="cell-pivot-dot" :title="t('timeline.references_title', { count: item.cell.referenceCount })"><Icon name="map-pin" :size="11" /></span>
        <img class="cell-thumb-canvas" :src="item.cell.thumb" width="44" height="44" alt="Thumb" />
      </button>
      <button :if="item.type === 'single' && item.cell.canLinkBefore" type="button"
        class="frame-link-button frame-link-before"
        :title="t('timeline.link_frames_title', { from: item.cell.index, to: item.cell.index + 1 })"
        @click.stop="onLinkFrames?.(item.cell.index - 1)">
        <Icon name="link" :size="12" />
      </button>
      <button :if="item.type === 'single' && item.cell.canLinkAfter" type="button" class="frame-link-button"
        :class="{ 'frame-link-after': true }"
        :title="t('timeline.link_frames_title', { from: item.cell.index + 1, to: item.cell.index + 2 })"
        @click.stop="onLinkFrames?.(item.cell.index)">
        <Icon name="link" :size="12" />
      </button>
    </div>

    <!-- Append / Drag New Cell -->
    <button
      class="frame-cell new"
      :class="{ 'is-dragging': isDraggingNew }"
      draggable="true"
      :title="t('timeline.add_frame_title')"
      @click="onAddFrame?.()"
      @dragstart="handleNewDragStart($event)"
      @dragend="cleanupDrag()"
    >
      <div class="cell-preview-thumb cell-new-thumb">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>
    </button>
  </div>

  <div :if="!!openFrameCountGroupId" class="group-frame-count-backdrop" @click="commitIntermediateCount(true)"></div>
  <div :if="!!openFrameCountGroupId" class="group-frame-count-dropup" :style="frameCountDropupStyle" @click.stop>
    <button type="button" :disabled="openFrameCountValue <= 1"
      @click.stop="adjustIntermediateCount(-1)" aria-label="-">−</button>
    <input class="group-frame-count-dropup-input" type="number" min="1" max="120" inputmode="numeric"
      :value="String(openFrameCountValue)" @input="handleDropupCountInput($event)"
      @keydown="handleIntermediateCountKeydown($event)" />
    <button type="button" :disabled="openFrameCountValue >= 120"
      @click.stop="adjustIntermediateCount(1)" aria-label="+">+</button>
  </div>
</div>
