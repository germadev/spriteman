<script :setup="{ open, ariaLabel, closeLabel, onClose }" type="text/typescript">
  const handleCancel = (e: Event) => {
    e.preventDefault();
    onClose?.();
  };

  const handleBackdropClick = (e: MouseEvent) => {
    if (e.target === e.currentTarget) onClose?.();
  };

  const handleKeydown = (e: KeyboardEvent) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      onClose?.();
    }
  };

  await $mounted();
  const dialog = $self('dialog') as HTMLDialogElement | null;
  if (dialog) {
    $effect(() => {
      if (open && !dialog.open) {
        dialog.showModal();
      } else if (!open && dialog.open) {
        dialog.close();
      }
    });
  }
</script>

<dialog class="app-dialog" :aria-label="ariaLabel || ''" @cancel="handleCancel($event)"
  @keydown="handleKeydown($event)" @click="handleBackdropClick($event)">
  <div class="app-dialog-surface">
    <header class="app-dialog-header">
      <div class="app-dialog-header-content"><slot.header /></div>
      <button class="app-dialog-close" type="button" :title="closeLabel || 'Close'" @click="onClose?.()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>
    <div class="app-dialog-body"><slot /></div>
    <footer :if="$slots.footer" class="app-dialog-footer"><slot.footer /></footer>
  </div>
</dialog>
