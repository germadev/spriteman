<script :setup type="text/typescript">
  const _d = (m: any) => m?.default ?? m;

  const { animationService } = await import('../services/animation.service');
  const { projectService } = await import('../services/project.service');
  const { pwaService } = await import('../services/pwa.service');
  const { storageService } = await import('../services/storage.service');
  const { tabsService } = await import('../services/tabs.service');
  const { canvasService } = await import('../services/canvas.service');
  const { i18nService } = await import('../services/i18n.service');

  // Messages must be in place before any child component renders.
  await i18nService.init();
  const t = i18nService.t;

  const CanvasStageComponent = _d(await import('../components/CanvasStage.html'));
  const FrameStripComponent = _d(await import('../components/FrameStrip.html'));
  const HierarchyTreeComponent = _d(await import('../components/HierarchyTree.html'));
  const PixelPaletteComponent = _d(await import('../components/PixelPalette.html'));
  const InspectorPanelComponent = _d(await import('../components/InspectorPanel.html'));
  const ProjectModalComponent = _d(await import('../components/ProjectModal.html'));
  const TextModalComponent = _d(await import('../components/TextModal.html'));
  const ExportModalComponent = _d(await import('../components/ExportModal.html'));
  const Icon = _d(await import('../components/Icon.html'));
  const ProjectTabsComponent = _d(await import('../components/ProjectTabs.html'));
  const WelcomeScreenComponent = _d(await import('../components/WelcomeScreen.html'));

  const { STANDARD_PIXEL_SIZES, PIXEL_ART_PALETTE } = await import('../helpers/palette.helper');
  const { getDiscreteFrameIndex } = await import('../helpers/animation.helper');
  const {
    buildAni,
    buildIco,
    exportAnimationSvg,
    exportFrameSvg,
    exportLottie,
    readActiveAnimation,
    renderFramePng,
    safeExportName,
  } = await import('../helpers/export.helper');
  const { formatMatrix } = await import('../helpers/format.helper');
  const { $toRaw } = await import('jq79');
  const { findRenderItem } = await import('../wasm/index');

  let hasActiveProject = false;
  let canvasWidth = 64;
  let canvasHeight = 64;
  let fps = 12;
  let isInstallable = pwaService.getState().isInstallable;
  let saveButtonText = t('app.save');

  $: currentSizeValue = `${canvasWidth || 64}x${canvasHeight || 64}`;
  $: currentSaveText = saveButtonText || t('app.save');

  let canvasStage: any;
  let frameStrip: any;
  let hierarchyTree: any;
  let pixelPalette: any;
  let inspectorPanel: any;
  let projectModal: any;
  let textModal: any;
  let exportModal: any;
  let projectTabs: any;
  let welcomeScreen: any;

  let currentZoom = 6;
  let selectedFrameIndex = 0;
  let activeProjectName = '';
  let isTempSwapped = false;
  let textModalAction: ((value: string) => void) | null = null;

  const closeTextModal = () => {
    if (textModal?.data) textModal.data.open = false;
    textModalAction = null;
  };

  const openTextModal = (options: {
    title: string;
    message?: string;
    inputValue?: string;
    inputLabel?: string;
    inputPlaceholder?: string;
    showInput?: boolean;
    showCancel?: boolean;
    confirmLabel?: string;
    onConfirm?: (value: string) => void;
  }) => {
    if (!textModal?.data) return;
    textModalAction = options.onConfirm ?? null;
    textModal.data.title = options.title;
    textModal.data.message = options.message || '';
    textModal.data.inputValue = options.inputValue || '';
    textModal.data.inputLabel = options.inputLabel || '';
    textModal.data.inputPlaceholder = options.inputPlaceholder || '';
    textModal.data.showInput = options.showInput === true;
    textModal.data.showCancel = options.showCancel === true;
    textModal.data.confirmLabel = options.confirmLabel || t('modal.confirm');
    textModal.data.open = true;
  };

  const syncPivotState = () => {
    const isPivot = canvasService.isPivotMode();
    const currentInt = selectedFrameIndex;
    const activeGroup = projectService.getActiveLayerGroupForFrame(currentInt);

    if (activeGroup && isPivot) {
      const proj = projectService.getState();
      const p = activeGroup.pivot ?? {
        x: Math.round(proj.meta.canvas_width / 2),
        y: Math.round(proj.meta.canvas_height / 2),
      };
      canvasService.setPivot(p);
    } else {
      if (isPivot && !activeGroup) {
        canvasService.setPivotMode(false);
        if (frameStrip?.data) frameStrip.data.isPivotMode = false;
      }
      canvasService.setPivot(null);
    }
  };

  const handleInstall = () => {
    pwaService.promptInstall();
  };

  /** Re-syncs the engine after a history step that changed more than pixels. */
  const afterHistoryStep = () => {
    if (projectService.didLastHistoryChangeStructure()) {
      animationService.reloadProject(projectService.getEngineJson());
      const totalFrames = projectService.getState().meta.total_frames;
      const curF = Math.min(selectedFrameIndex, Math.max(0, totalFrames - 1));
      selectedFrameIndex = curF;
      animationService.seek(curF);
    }
    saveCurrentProject();
  };

  const handleUndo = () => {
    if (projectService.undo()) afterHistoryStep();
  };

  const handleRedo = () => {
    if (projectService.redo()) afterHistoryStep();
  };

  const swapPaletteColors = () => {
    if (!pixelPalette?.data) return;
    const temp = pixelPalette.data.primaryColor;
    pixelPalette.data.primaryColor = pixelPalette.data.secondaryColor;
    pixelPalette.data.secondaryColor = temp;
    canvasService.setColors(pixelPalette.data.primaryColor, pixelPalette.data.secondaryColor);
  };

  let saveTimer: number | null = null;
  let saveLabelTimer: number | null = null;
  let savePending = false;

  const setSaveLabel = (text: string, revertAfter?: number) => {
    saveButtonText = text;
    if (saveLabelTimer !== null) {
      clearTimeout(saveLabelTimer);
      saveLabelTimer = null;
    }
    if (revertAfter) {
      saveLabelTimer = window.setTimeout(() => {
        saveButtonText = t('app.save');
        saveLabelTimer = null;
      }, revertAfter);
    }
  };

  /** Writes the document to storage. Serialization happens here, not on every edit. */
  const flushSave = async (): Promise<void> => {
    if (saveTimer !== null) {
      clearTimeout(saveTimer);
      saveTimer = null;
    }
    if (!activeProjectName || !savePending) return;
    savePending = false;

    try {
      await storageService.saveFile(activeProjectName, projectService.getRawJson());
      setSaveLabel(t('app.saved'), 1200);
    } catch (err: any) {
      // A failed save used to disappear into an un-awaited promise; make it visible.
      savePending = true;
      setSaveLabel(t('app.save_failed'));
      console.error('[storage] Failed to save project:', err);
      const message =
        err?.name === 'StorageQuotaError'
          ? t('storage.quota_exceeded', { name: activeProjectName })
          : t('storage.save_failed');
      openTextModal({
        title: t('storage.error_title'),
        message,
        confirmLabel: t('modal.confirm'),
      });
    }
  };

  /**
   * Marks the document dirty and schedules a write. Edits arrive in bursts (one per
   * stroke, per drag step), so the actual serialize + write happens once things settle.
   */
  const saveCurrentProject = (): void => {
    if (!activeProjectName) return;
    savePending = true;
    setSaveLabel(t('app.saving'));
    if (saveTimer !== null) clearTimeout(saveTimer);
    saveTimer = window.setTimeout(() => {
      saveTimer = null;
      // Serializing the document is the one heavy step left; run it when the main thread
      // is idle so it never lands in the middle of a stroke.
      const idle = (window as any).requestIdleCallback;
      if (typeof idle === 'function') {
        idle(() => flushSave(), { timeout: 2000 });
      } else {
        flushSave();
      }
    }, 500);
  };

  const downloadBlob = (blob: Blob, filename: string): void => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  };

  const openExportModal = (): void => {
    if (!exportModal?.data) return;
    const state = projectService.getState();
    const active = state.animations.find((animation: any) => animation.id === state.activeAnimationId);
    exportModal.data.frameNumber = selectedFrameIndex + 1;
    exportModal.data.animationName = active?.name || '';
    exportModal.data.open = true;
  };

  const exportSelection = async (scope: string, format: string): Promise<void> => {
    if (!activeProjectName) return;
    try {
      const projectJson = projectService.getRawJson();
      const animation = readActiveAnimation(projectJson);
      const projectName = safeExportName(activeProjectName);
      const animationName = safeExportName(animation.name);

      if (scope === 'project' && format === 'spritemotion') {
        downloadBlob(new Blob([projectJson], { type: 'application/json' }), `${projectName}.spritemotion.json`);
      } else if (scope === 'frame' && format === 'svg') {
        downloadBlob(new Blob([exportFrameSvg(animation, selectedFrameIndex)], { type: 'image/svg+xml' }), `${animationName}-frame-${selectedFrameIndex + 1}.svg`);
      } else if (scope === 'animation' && format === 'svg') {
        downloadBlob(new Blob([exportAnimationSvg(animation)], { type: 'image/svg+xml' }), `${animationName}.animated.svg`);
      } else if (scope === 'animation' && format === 'lottie') {
        downloadBlob(new Blob([exportLottie(animation)], { type: 'application/json' }), `${animationName}.lottie.json`);
      } else if (scope === 'frame' && format === 'ico') {
        const png = await renderFramePng(animation.frames[selectedFrameIndex] || {}, animation.width, animation.height);
        const ico = buildIco(png, Math.min(256, animation.width), Math.min(256, animation.height));
        downloadBlob(new Blob([ico as BlobPart], { type: 'image/x-icon' }), `${animationName}-frame-${selectedFrameIndex + 1}.ico`);
      } else if (scope === 'animation' && format === 'ani') {
        const icons: Uint8Array[] = [];
        for (const frame of animation.frames) {
          const png = await renderFramePng(frame, animation.width, animation.height);
          icons.push(buildIco(png, Math.min(256, animation.width), Math.min(256, animation.height)));
        }
        const ani = buildAni(icons, Math.min(256, animation.width), Math.min(256, animation.height), animation.fps);
        downloadBlob(new Blob([ani as BlobPart], { type: 'application/x-navi-animation' }), `${animationName}.ani`);
      }
      if (exportModal?.data) exportModal.data.open = false;
    } catch (error) {
      console.error('[export] Failed to export', error);
      if (exportModal?.data) exportModal.data.open = false;
      openTextModal({ title: t('export.error_title'), message: t('export.error_message') });
    }
  };

  const loadActiveProject = async (projectName: string): Promise<void> => {
    activeProjectName = projectName;
    let json = await storageService.readFile(projectName);

    if (!json) {
      if (projectName === 'sample_walk') {
        json = await fetch('./examples/sample_walk.json').then((r) => r.text());
        await storageService.saveFile(projectName, json);
      } else {
        // Create fallback project with 1 frame
        // 12 fps is the default playback rate; the fourth argument is fps, not frames.
        json = projectService.createNewProject(projectName, 64, 64, 12);
        await storageService.saveFile(projectName, json);
      }
    }

    projectService.setProjectJson(json);
    await animationService.reloadProject(projectService.getEngineJson());
    selectedFrameIndex = 0;
    animationService.seek(0);
    syncPivotState();
  };

  const handleCreateProject = async (name: string, w: number, h: number, fpsVal: number): Promise<void> => {
    const slug = name.trim().replace(/\s+/g, '_') || 'sprite_character';
    const json = projectService.createNewProject(slug, w, h, fpsVal);
    await storageService.saveFile(slug, json);

    // Open tab (adds tab, marks active, updates URL hash, displays editor)
    tabsService.openTab(slug);
  };

  const handleOpenProject = async (filename: string): Promise<void> => {
    const slug = filename.replace('.json', '');
    tabsService.openTab(slug);
  };

  const handleOpenSample = async (): Promise<void> => {
    tabsService.openTab('sample_walk');
  };

  const handleImportJson = async (json: string): Promise<void> => {
    let name = 'imported_sprite';
    try {
      const parsed = JSON.parse(json);
      if (parsed.meta?.name) name = parsed.meta.name.replace(/\s+/g, '_');
    } catch {}

    await storageService.saveFile(name, json);
    tabsService.openTab(name);
  };

  const applyTabsState = async (state: any): Promise<void> => {
    if (projectTabs?.data) {
      projectTabs.data.tabs = state.tabs;
      projectTabs.data.activeTab = state.activeTab;
    }

    const hasProject = state.tabs.length > 0 && !!state.activeTab;
    const projState = projectService.getState();

    hasActiveProject = hasProject;
    canvasWidth = projState.meta.canvas_width;
    canvasHeight = projState.meta.canvas_height;
    fps = projState.meta.fps;

    if (!hasProject) {
      animationService.pause();
      const files = await storageService.listFiles();
      if (welcomeScreen?.data) welcomeScreen.data.savedFiles = files;
      syncPivotState();
      return;
    }

    // Load active tab content from WASMFS
    await loadActiveProject(state.activeTab);
  };

  /**
   * Writes a value into a child component only when it actually changed. jq79 runs the
   * effects for a property the moment it is assigned, so assigning a dozen unchanged
   * fields per notification re-rendered the panel a dozen times over.
   */
  const setField = (component: any, key: string, value: any): void => {
    if (!component?.data) return;
    // Both sides may be reactive proxies wrapping the same underlying object — one from
    // the project store, one from the component store — so compare the raw values.
    // Comparing proxies makes every write look like a change and triggers a deep diff.
    const next = value && typeof value === 'object' ? $toRaw(value) : value;
    const current = component.data[key];
    const currentRaw = current && typeof current === 'object' ? $toRaw(current) : current;
    if (currentRaw !== next) {
      component.data[key] = next;
    }
  };

  const handleCanvasSizeChange = (e: Event) => {
    const [width, height] = (e.target as HTMLSelectElement).value.split('x').map(Number);
    projectService.setCanvasSize(width, height);
    canvasService.setCanvasSize(width, height);
    animationService.reloadProject(projectService.getEngineJson());
    saveCurrentProject();
  };

  const handleFpsChange = (e: Event) => {
    const nextFps = parseInt((e.target as HTMLSelectElement).value, 10);
    projectService.setFps(nextFps);
    animationService.setFps(nextFps);
    animationService.reloadProject(projectService.getEngineJson());
    saveCurrentProject();
  };

  let lastFramesStamp = '';
  let lastLayersStamp = '';
  let lastPlaybackFrame = -1;
  let playbackWasRunning = false;
  // Shared so "this layer has no groups" keeps a stable identity between updates;
  // a fresh [] every time reads as a change and rebuilds the whole frame reel.
  const NO_GROUPS: any[] = [];

  const syncTimelinePlayhead = (frameIndex: number, totalFrames: number, isPlaying: boolean): void => {
    if (frameIndex === lastPlaybackFrame && isPlaying === playbackWasRunning) return;
    lastPlaybackFrame = frameIndex;
    playbackWasRunning = isPlaying;

    const wrapper = document.querySelector('.framestrip-wrapper');
    wrapper?.querySelector('.frame-cell.is-playhead')?.classList.remove('is-playhead');
    if (isPlaying) {
      wrapper?.querySelector(`.frame-cell[data-frame-index="${frameIndex}"]`)?.classList.add('is-playhead');
    }
    const indicator = wrapper?.querySelector('.frame-indicator span');
    if (indicator) {
      indicator.textContent = t('timeline.frame_indicator', { current: frameIndex + 1, total: totalFrames });
    }
  };

  /** Pushes the shared editor state into the panels, skipping anything unchanged. */
  const syncPanels = (projState: any, animState: any): void => {
    const currentInt = getDiscreteFrameIndex(animState.currentFrame, animState.totalFrames);
    const activeLayer = (projState.layers || []).find((l: any) => l && l.id === projState.selectedLayerId);
    const layerGroups = activeLayer?.groups || NO_GROUPS;
    const activeGroup = projectService.getActiveLayerGroupForFrame(currentInt);
    const isPivot = canvasService.isPivotMode();

    if (frameStrip?.data) {
      setField(frameStrip, 'selectedFrame', selectedFrameIndex);
      setField(frameStrip, 'totalFrames', projState.meta.total_frames);
      setField(frameStrip, 'isPlaying', animState.isPlaying);
      setField(frameStrip, 'onionSkin', animState.onionSkinEnabled);
      setField(frameStrip, 'framePixels', projState.frame_pixels);
      setField(frameStrip, 'spriteWidth', projState.meta.canvas_width);
      setField(frameStrip, 'spriteHeight', projState.meta.canvas_height);
      setField(frameStrip, 'animations', projState.animations);
      setField(frameStrip, 'activeAnimationId', projState.activeAnimationId);
      setField(frameStrip, 'layerGroups', layerGroups);
      setField(frameStrip, 'activeGroup', activeGroup);
      setField(frameStrip, 'isPivotMode', isPivot);
      setField(frameStrip, 'canUndo', projectService.canUndo());
      setField(frameStrip, 'canRedo', projectService.canRedo());

      // Thumbnails are keyed by these stamps, so they refresh exactly when content does.
      const stamp = projectService.getFramesStamp();
      if (stamp !== lastFramesStamp) {
        lastFramesStamp = stamp;
        frameStrip.data.frameEpoch = projectService.getFramesEpoch();
        frameStrip.data.frameRevisions = projectService.getFrameRevisions();
      }
      syncTimelinePlayhead(currentInt, projState.meta.total_frames, animState.isPlaying);
    }

    if (animState.resolvedFrame && inspectorPanel?.data) {
      // Only the selected layer is materialized out of the packed frame buffer.
      const selectedItem = findRenderItem(animState.resolvedFrame, projState.selectedLayerId);
      inspectorPanel.data.item = selectedItem;
      setField(inspectorPanel, 'matrixText', selectedItem?.matrix ? formatMatrix(selectedItem.matrix) : '');
    }
  };

  /**
   * Hands the canvas the frame content. The composite is maintained by the project
   * service, so this reads it instead of recomposing, and the moving-layer highlight is
   * registered as a provider that only runs when the highlight is drawn.
   */
  const syncCanvasContent = (projState: any, animState: any): void => {
    const currentInt = getDiscreteFrameIndex(animState.currentFrame, animState.totalFrames);
    const totalFrames = Math.max(1, projState.meta.total_frames || 1);
    const previousInt = (currentInt - 1 + totalFrames) % totalFrames;
    const onionPixels =
      animState.onionSkinEnabled && totalFrames > 1 ? projectService.getFrameComposite(previousInt) : null;
    canvasService.setFramePixels(projectService.getFrameComposite(currentInt), onionPixels);
    canvasService.setActiveLayerSource(
      `${currentInt}:${projState.selectedLayerId}:${projectService.getFramesStamp()}`,
      () => projectService.getActiveLayerMovingPixels(currentInt)
    );
  };

  const bindServices = () => {
    // 1. Tabs service synchronization
    tabsService.subscribe((state: any) => {
      applyTabsState(state);
    });

    // 2. Animation service updates
    animationService.subscribe((animState: any) => {
      const proj = projectService.getState();
      syncPanels(proj, animState);
      syncCanvasContent(proj, animState);
      syncPivotState();
    });

    // 3. Project service updates
    projectService.subscribe((projState: any) => {
      const anim = animationService.getState();

      if (hierarchyTree?.data) {
        // `getState()` hands back a fresh array every time, so compare content instead of
        // identity — otherwise the whole tree re-renders on every pixel edit.
        const layersStamp = projectService.getLayersStamp();
        if (layersStamp !== lastLayersStamp) {
          lastLayersStamp = layersStamp;
          hierarchyTree.data.layers = projState.layers;
        }
        setField(hierarchyTree, 'selectedLayerId', projState.selectedLayerId);
        setField(hierarchyTree, 'isPivotMode', canvasService.isPivotMode());
      }

      canvasWidth = projState.meta.canvas_width;
      canvasHeight = projState.meta.canvas_height;
      fps = projState.meta.fps;

      canvasService.setCanvasSize(projState.meta.canvas_width, projState.meta.canvas_height);
      syncPivotState();
      syncPanels(projState, anim);
      syncCanvasContent(projState, anim);
    });

    // 4. PWA state updates
    pwaService.subscribe((pwa: any) => {
      isInstallable = pwa.isInstallable;
    });
  };

  const initKeyboardShortcuts = () => {
    window.addEventListener('keydown', (e: KeyboardEvent) => {
      // Don't intercept when user is typing in inputs or textareas
      const target = e.target as HTMLElement | null;
      if (
        target &&
        (target.tagName === 'INPUT' ||
          target.tagName === 'TEXTAREA' ||
          target.isContentEditable ||
          target.classList.contains('layer-rename-input'))
      ) {
        return;
      }

      // Check if project is open
      const hasProject = tabsService.getState().tabs.length > 0 && !!tabsService.getState().activeTab;
      if (!hasProject) return;

      const isCmdOrCtrl = e.metaKey || e.ctrlKey;

      // Undo / Redo: Cmd+Z, Cmd+Shift+Z, Cmd+Y
      if (isCmdOrCtrl) {
        if (e.key === 'z' || e.key === 'Z') {
          e.preventDefault();
          if (e.shiftKey) {
            handleRedo();
          } else {
            handleUndo();
          }
          return;
        }
        if (e.key === 'y' || e.key === 'Y') {
          e.preventDefault();
          handleRedo();
          return;
        }
      }

      // Add frame hotkey: '+' or '=' (with or without shift, or numpad +)
      if ((e.key === '+' || e.key === '=' || e.code === 'NumpadAdd') && !isCmdOrCtrl && !e.altKey) {
        e.preventDefault();
        const newIdx = projectService.addFrame(true);
        animationService.reloadProject(projectService.getEngineJson());
        selectedFrameIndex = newIdx;
        animationService.seek(newIdx);
        saveCurrentProject();
        return;
      }

      // Palette color swap shortcuts: X or temporary swap with Cmd/Alt
      if (e.key === 'x' || e.key === 'X') {
        swapPaletteColors();
        return;
      }

      if ((e.key === 'Meta' || e.key === 'Alt') && !isTempSwapped) {
        isTempSwapped = true;
        swapPaletteColors();
        if (pixelPalette?.data) pixelPalette.data.isTempSwapped = true;
      }
    });

    window.addEventListener('keyup', (e: KeyboardEvent) => {
      if (isTempSwapped && (e.key === 'Meta' || e.key === 'Alt') && !e.metaKey && !e.altKey) {
        isTempSwapped = false;
        swapPaletteColors();
        if (pixelPalette?.data) pixelPalette.data.isTempSwapped = false;
      }
    });

    window.addEventListener('blur', () => {
      if (isTempSwapped) {
        isTempSwapped = false;
        swapPaletteColors();
        if (pixelPalette?.data) pixelPalette.data.isTempSwapped = false;
      }
    });
  };

  const initAppFlow = async (): Promise<void> => {
    // 1. Ensure sample project is stored in WASMFS if first time
    const files = await storageService.listFiles();
    if (files.length === 0) {
      try {
        const sampleText = await fetch('./examples/sample_walk.json').then((r) => r.text());
        await storageService.saveFile('sample_walk', sampleText);
      } catch {}
    }

    // Refresh file list in welcome and modal
    const updatedFiles = await storageService.listFiles();
    if (welcomeScreen?.data) welcomeScreen.data.savedFiles = updatedFiles;
    if (projectModal?.data) projectModal.data.savedFiles = updatedFiles;

    // 2. Read tabs from URL hash: #tabs=<id1>,#<active>,<id2>
    const initialTabsState = tabsService.getState();
    await applyTabsState(initialTabsState);
  };

  // Lifecycle: Wait for component template to be mounted in DOM
  await $mounted();

  const root = document.querySelector('.app-container') || document.body;

  // Mount CanvasStage Component
  canvasStage = CanvasStageComponent.mount(root.querySelector('.canvas-stage-wrapper'), {
    t,
    canvasService,
    onPaintStroke: (pixels: any, color: string) => {
      const currentInt = selectedFrameIndex;
      const group = projectService.getActiveLayerGroupForFrame(currentInt);
      if (group && currentInt > group.start_frame && currentInt < group.end_frame) {
        return;
      }
      const selectedId = projectService.getState().selectedLayerId;
      if (color === '__eraser__') {
        projectService.erasePixels(currentInt, pixels, selectedId);
      } else {
        projectService.setPixels(currentInt, pixels, color, selectedId);
      }
      saveCurrentProject();
    },
    onSetPivot: (x: number, y: number) => {
      const proj = projectService.getState();
      const selectedId = proj.selectedLayerId;
      const currentInt = selectedFrameIndex;
      if (selectedId) {
        const group = projectService.getActiveLayerGroupForFrame(currentInt);
        if (group) {
          projectService.setGroupPivot(selectedId, group.id, x, y);
          canvasService.setPivot({ x, y });
        }
        saveCurrentProject();
      }
    },
    onStartTranslateLayer: () => {
      const proj = projectService.getState();
      const selectedId = proj.selectedLayerId;
      const currentInt = selectedFrameIndex;
      if (selectedId) {
        projectService.startLayerTranslation(selectedId, currentInt);
      }
    },
    onTranslateLayer: (deltaX: number, deltaY: number, isFinal: boolean = true) => {
      const proj = projectService.getState();
      const selectedId = proj.selectedLayerId;
      const currentInt = selectedFrameIndex;
      if (selectedId) {
        projectService.translateLayer(selectedId, deltaX, deltaY, currentInt, isFinal);
        // Read the composite the project already maintains, and let the highlight resolve
        // itself lazily — a drag step must not recompose or rebuild anything eagerly.
        canvasService.setFramePixels(projectService.getFrameComposite(currentInt));
        canvasService.setActiveLayerSource(
          `drag:${currentInt}:${selectedId}:${deltaX}:${deltaY}:${isFinal}`,
          () => projectService.getActiveLayerMovingPixels(currentInt)
        );
        if (isFinal) {
          animationService.reloadProject(projectService.getEngineJson());
          saveCurrentProject();
        }
      }
    },
    onStartMovePixel: (x: number, y: number) => {
      const proj = projectService.getState();
      const selectedId = proj.selectedLayerId;
      const currentInt = selectedFrameIndex;
      if (selectedId) {
        projectService.startPixelMove(selectedId, currentInt, x, y);
      }
    },
    onMovePixel: (fromX: number, fromY: number, toX: number, toY: number, isFinal: boolean = true) => {
      const proj = projectService.getState();
      const selectedId = proj.selectedLayerId;
      const currentInt = selectedFrameIndex;
      if (selectedId) {
        projectService.movePixel(selectedId, currentInt, fromX, fromY, toX, toY, isFinal);
        canvasService.setFramePixels(projectService.getFrameComposite(currentInt));
        canvasService.setActiveLayerSource(
          `pixel:${currentInt}:${selectedId}:${toX}:${toY}`,
          () => projectService.getActiveLayerMovingPixels(currentInt)
        );
        if (isFinal) {
          animationService.reloadProject(projectService.getEngineJson());
          saveCurrentProject();
        }
      }
    },
    onZoomChange: (zoomVal: number) => {
      currentZoom = zoomVal;
    },
  });

  // Mount other child components
  projectTabs = ProjectTabsComponent.mount(root.querySelector('.tabs-wrapper'), {
    t,
    tabs: [],
    activeTab: null,
    onSelectTab: (tabId: string) => tabsService.selectTab(tabId),
    onCloseTab: (tabId: string) => tabsService.closeTab(tabId),
    onNewTab: async () => {
      const files = await storageService.listFiles();
      if (projectModal?.data) {
        projectModal.data.savedFiles = files;
        projectModal.data.currentTab = 'new';
        projectModal.data.isOpen = true;
      }
    },
  });

  welcomeScreen = WelcomeScreenComponent.mount(root.querySelector('.welcome-screen-wrapper'), {
    t,
    savedFiles: [],
    sizes: STANDARD_PIXEL_SIZES,
    onCreateProject: (name: string, w: number, h: number, fpsVal: number) => handleCreateProject(name, w, h, fpsVal),
    onOpenProject: (filename: string) => handleOpenProject(filename),
    onOpenSample: () => handleOpenSample(),
    onImportJson: (json: string) => handleImportJson(json),
  });

  hierarchyTree = HierarchyTreeComponent.mount(root.querySelector('.hierarchy-wrapper'), {
    t,
    layers: [],
    selectedLayerId: null,
    isPivotMode: false,
    onSelectLayer: (layerId: string) => {
      projectService.selectLayer(layerId);
      syncPivotState();
    },
    onAddLayer: () => {
      projectService.addLayer();
      animationService.reloadProject(projectService.getEngineJson());
      saveCurrentProject();
    },
    onToggleLayerRelative: (layerId: string) => {
      projectService.toggleLayerRelative(layerId);
      animationService.reloadProject(projectService.getEngineJson());
      saveCurrentProject();
    },
    onToggleLayerVisibility: (layerId: string) => {
      projectService.toggleLayerVisibility(layerId);
      animationService.reloadProject(projectService.getEngineJson());
      saveCurrentProject();
    },
    onChangeLayerOpacity: (layerId: string, opacity: number) => {
      projectService.setLayerOpacity(layerId, opacity);
      animationService.reloadProject(projectService.getEngineJson());
      saveCurrentProject();
    },
    onRenameLayer: (layerId: string, name: string) => {
      projectService.renameLayer(layerId, name);
      animationService.reloadProject(projectService.getEngineJson());
      saveCurrentProject();
    },
    onDeleteLayer: (layerId: string) => {
      if (projectService.deleteLayer(layerId)) {
        animationService.reloadProject(projectService.getEngineJson());
        saveCurrentProject();
      }
    },
    onTogglePivotMode: () => {
      // Legacy HierarchyTree pivot toggle no longer used
    },
    onReorderLayer: (layerId: string, targetIndex: number, newParentId: string | null) => {
      projectService.reorderLayer(layerId, targetIndex, newParentId);
      animationService.reloadProject(projectService.getEngineJson());
      saveCurrentProject();
    },
  });

  frameStrip = FrameStripComponent.mount(root.querySelector('.framestrip-wrapper'), {
    t,
    totalFrames: 1,
    selectedFrame: 0,
    isPlaying: false,
    onionSkin: true,
    spriteWidth: 64,
    spriteHeight: 64,
    framePixels: {},
    frameRevisions: [],
    frameEpoch: 0,
    animations: [],
    activeAnimationId: '',
    layerGroups: [],
    activeGroup: null,
    isPivotMode: false,
    canUndo: false,
    canRedo: false,
    onTogglePlay: () => {
      if (animationService.getState().isPlaying) {
        animationService.pause();
        animationService.seek(selectedFrameIndex);
      } else {
        animationService.seek(selectedFrameIndex);
        animationService.play();
      }
    },
    onSelectFrame: (idx: number) => {
      animationService.pause();
      selectedFrameIndex = idx;
      animationService.seek(idx);
      syncPivotState();
    },
    onSelectRange: (start: number, end: number) => {},
    onStep: (delta: number) => {
      animationService.pause();
      const total = Math.max(1, animationService.getState().totalFrames);
      selectedFrameIndex = (selectedFrameIndex + delta + total) % total;
      animationService.seek(selectedFrameIndex);
      syncPivotState();
    },
    onAddFrame: (targetIndex?: number) => {
      const newIdx = typeof targetIndex === 'number'
        ? projectService.insertFrame(targetIndex, true)
        : projectService.addFrame(true);
      animationService.reloadProject(projectService.getEngineJson());
      selectedFrameIndex = newIdx;
      animationService.seek(newIdx);
      saveCurrentProject();
    },
    onReorderFrame: (from: number, to: number) => {
      projectService.reorderFrame(from, to);
      animationService.reloadProject(projectService.getEngineJson());
      selectedFrameIndex = to;
      animationService.seek(to);
      saveCurrentProject();
    },
    onDuplicateFrame: () => {
      const currentInt = selectedFrameIndex;
      const newIdx = projectService.duplicateFrame(currentInt);
      animationService.reloadProject(projectService.getEngineJson());
      selectedFrameIndex = newIdx;
      animationService.seek(newIdx);
      saveCurrentProject();
    },
    onDeleteFrame: () => {
      const currentInt = selectedFrameIndex;
      projectService.deleteFrame(currentInt);
      animationService.reloadProject(projectService.getEngineJson());
      const nextInt = Math.max(0, currentInt - 1);
      selectedFrameIndex = nextInt;
      animationService.seek(nextInt);
      saveCurrentProject();
    },
    onToggleOnionSkin: (enabled: boolean) => animationService.setOnionSkinEnabled(enabled),
    onGroupFrames: (start: number, end: number) => {
      const selectedId = projectService.getState().selectedLayerId;
      if (selectedId) {
        projectService.createFrameGroup(selectedId, start, end);
        animationService.reloadProject(projectService.getEngineJson());
        saveCurrentProject();
        syncPivotState();
      }
    },
    onUngroupFrames: (groupId: string) => {
      const selectedId = projectService.getState().selectedLayerId;
      if (selectedId) {
        projectService.deleteFrameGroup(selectedId, groupId);
        animationService.reloadProject(projectService.getEngineJson());
        saveCurrentProject();
        syncPivotState();
      }
    },
    onToggleGroupPivotMode: () => {
      const currentInt = selectedFrameIndex;
      const group = projectService.getActiveLayerGroupForFrame(currentInt);
      if (!group) return;

      const next = !canvasService.isPivotMode();
      canvasService.setPivotMode(next);
      if (frameStrip?.data) frameStrip.data.isPivotMode = next;
      syncPivotState();
    },
    onSelectAnimation: (animId: string) => {
      projectService.selectAnimation(animId);
      animationService.reloadProject(projectService.getEngineJson());
      selectedFrameIndex = 0;
      animationService.seek(0);
      saveCurrentProject();
      syncPivotState();
    },
    onAddAnimation: () => {
      openTextModal({
        title: t('timeline.new_animation_prompt'),
        inputValue: 'walk',
        showInput: true,
        showCancel: true,
        confirmLabel: t('timeline.add_animation'),
        onConfirm: (name: string) => {
          projectService.addAnimation(name.trim() || undefined);
          animationService.reloadProject(projectService.getEngineJson());
          selectedFrameIndex = 0;
          animationService.seek(0);
          saveCurrentProject();
          syncPivotState();
        },
      });
    },
    onRequestRenameAnimation: (animId: string, currentName: string) => {
      openTextModal({
        title: t('timeline.rename_animation_prompt'),
        inputValue: currentName,
        showInput: true,
        showCancel: true,
        confirmLabel: t('modal.confirm'),
        onConfirm: (name: string) => {
          const trimmed = name.trim();
          if (trimmed && trimmed !== currentName) {
            projectService.renameAnimation(animId, trimmed);
            saveCurrentProject();
          }
        },
      });
    },
    onDeleteAnimation: (animId: string) => {
      projectService.deleteAnimation(animId);
      animationService.reloadProject(projectService.getEngineJson());
      selectedFrameIndex = 0;
      animationService.seek(0);
      saveCurrentProject();
      syncPivotState();
    },
    onUndo: () => handleUndo(),
    onRedo: () => handleRedo(),
  });

  inspectorPanel = InspectorPanelComponent.mount(root.querySelector('.inspector-wrapper'), {
    t,
    item: null,
    matrixText: '',
  });

  pixelPalette = PixelPaletteComponent.mount(root.querySelector('.palette-wrapper'), {
    t,
    primaryColor: '#000000',
    secondaryColor: '#ffffff',
    isTempSwapped: false,
    palette: PIXEL_ART_PALETTE,
    onSelectPrimary: (color: string) => {
      if (pixelPalette?.data) {
        pixelPalette.data.primaryColor = color;
      }
      canvasService.setPrimaryColor(color);
    },
    onSelectSecondary: (color: string) => {
      if (pixelPalette?.data) {
        pixelPalette.data.secondaryColor = color;
      }
      canvasService.setSecondaryColor(color);
    },
    onSelectColors: (primary: string, secondary: string) => {
      if (pixelPalette?.data) {
        pixelPalette.data.primaryColor = primary;
        pixelPalette.data.secondaryColor = secondary;
      }
      canvasService.setColors(primary, secondary);
    },
    onSwapColors: () => {
      swapPaletteColors();
    },
  });



  projectModal = ProjectModalComponent.mount(root.querySelector('.modal-wrapper'), {
    t,
    isOpen: false,
    currentTab: 'new',
    savedFiles: [],
    sizes: STANDARD_PIXEL_SIZES,
    onCreate: (name: string, w: number, h: number, fpsVal: number) => {
      handleCreateProject(name, w, h, fpsVal);
      if (projectModal?.data) projectModal.data.isOpen = false;
    },
    onOpen: (filename: string) => {
      handleOpenProject(filename);
      if (projectModal?.data) projectModal.data.isOpen = false;
    },
    onLoadSample: () => {
      handleOpenSample();
      if (projectModal?.data) projectModal.data.isOpen = false;
    },
    onImportJson: (json: string) => {
      handleImportJson(json);
      if (projectModal?.data) projectModal.data.isOpen = false;
    },
    onClose: () => {
      if (projectModal?.data) projectModal.data.isOpen = false;
    },
  });

  textModal = TextModalComponent.mount(root.querySelector('.text-modal-wrapper'), {
    t,
    open: false,
    title: '',
    message: '',
    inputValue: '',
    inputLabel: '',
    inputPlaceholder: '',
    showInput: false,
    showCancel: false,
    confirmLabel: t('modal.confirm'),
    onConfirm: (value: string) => {
      const action = textModalAction;
      if (textModal?.data) textModal.data.open = false;
      textModalAction = null;
      action?.(value);
    },
    onClose: () => closeTextModal(),
  });

  exportModal = ExportModalComponent.mount(root.querySelector('.export-modal-wrapper'), {
    t,
    open: false,
    frameNumber: 1,
    animationName: '',
    onExport: (scope: string, format: string) => exportSelection(scope, format),
    onClose: () => {
      if (exportModal?.data) exportModal.data.open = false;
    },
  });

  // A pending debounced write must not be lost when the tab closes or is hidden.
  window.addEventListener('beforeunload', () => { flushSave(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSave();
  });

  bindServices();
  initKeyboardShortcuts();
  await initAppFlow();
</script>

<div class="app-container">
  <!-- Top Application Bar -->
  <div class="app-topbar">
    <div class="topbar-left">
      <div class="app-logo">
        <img src="./icon-192.svg" class="logo-pixel-img" width="22" height="22" alt="Logo" />
        <span class="logo-text">{{ t('app.name') }}</span>
      </div>

      <!-- Project Tabs Strip -->
      <div class="tabs-wrapper"></div>
    </div>

    <div class="topbar-center">
      <select :if="hasActiveProject" id="topbar-size-badge" class="badge-tag topbar-select"
        :value="currentSizeValue" :title="t('settings.canvas_size')" @change="handleCanvasSizeChange">
        <option :each="preset in STANDARD_PIXEL_SIZES" :key="preset.labelKey"
          :value="`${preset.width}x${preset.height}`">{{ preset.width }} × {{ preset.height }} px</option>
      </select>
      <select :if="hasActiveProject" id="topbar-fps-badge" class="badge-tag topbar-select"
        :value="String(fps || 12)" :title="t('settings.fps')" @change="handleFpsChange">
        <option value="6">6 FPS</option>
        <option value="8">8 FPS</option>
        <option value="12">12 FPS</option>
        <option value="16">16 FPS</option>
        <option value="24">24 FPS</option>
        <option value="30">30 FPS</option>
      </select>
    </div>

    <div class="topbar-right">
      <button
        :if="hasActiveProject"
        id="btn-menu-export"
        class="topbar-btn"
        :title="t('app.export_title')"
        @click="openExportModal()"
      ><Icon name="download" :size="14" />{{ t('app.export') }}</button>
      <button
        :if="hasActiveProject"
        id="btn-menu-save"
        class="topbar-btn primary"
        :title="t('app.save_title')"
        @click="flushSave()"
      ><Icon name="save" :size="14" />{{ currentSaveText }}</button>
      <button
        :if="isInstallable"
        id="pwa-install-btn"
        class="pwa-install-btn"
        @click="handleInstall()"
      ><Icon name="download" :size="14" />{{ t('app.install') }}</button>
    </div>
  </div>

  <!-- Welcome Screen (Shown when no project is open) -->
  <div class="welcome-screen-wrapper" :style="`display: ${hasActiveProject ? 'none' : 'flex'};`"></div>

  <!-- Main Docked Editor Workspace (Hidden when no project is open) -->
  <div class="app-workspace" :style="`display: ${hasActiveProject ? 'grid' : 'none'};`">
    <!-- Center Canvas & Bottom Timeline -->
    <div class="center-workspace">
      <div class="canvas-viewport-panel">
        <div class="canvas-stage-wrapper"></div>
      </div>
      <div class="timeline-docked-panel">
        <div class="framestrip-wrapper"></div>
      </div>
    </div>

    <!-- Right Side Tools Sidebar -->
    <div class="sidebar-docked-panel">
      <div class="sidebar-scrollable">
        <div class="hierarchy-wrapper"></div>
        <div class="inspector-wrapper"></div>
        <div class="palette-wrapper"></div>
      </div>
    </div>
  </div>

  <!-- Modal Container -->
  <div class="modal-wrapper"></div>
  <div class="text-modal-wrapper"></div>
  <div class="export-modal-wrapper"></div>
</div>
